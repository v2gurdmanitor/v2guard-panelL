<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود | V2GUARD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b12;
      --card: rgba(17,24,39,.78);
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8d98a9;
      --green: #20e070;
      --green2: #0eaf58;
      --red: #ff5268;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(32,224,112,.12), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(45,125,255,.10), transparent 30%),
        var(--bg);
      overflow: hidden;
    }

    .orb {
      position: fixed;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .13;
      pointer-events: none;
      animation: float 10s ease-in-out infinite;
    }

    .orb.one {
      background: var(--green);
      top: -150px;
      right: -100px;
    }

    .orb.two {
      background: #277cff;
      bottom: -160px;
      left: -100px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%,100% {
        transform: translate(0,0) scale(1);
      }

      50% {
        transform: translate(35px,25px) scale(1.12);
      }
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 34px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          rgba(22,31,48,.88),
          rgba(9,14,24,.82)
        );
      backdrop-filter: blur(25px);
      box-shadow: 0 30px 100px rgba(0,0,0,.45);
      animation: enter .7s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(135deg,var(--green),var(--green2));
      color: #06100b;
      font-size: 20px;
      font-weight: 900;
      box-shadow: 0 0 45px rgba(32,224,112,.25);
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    h1 {
      margin-top: 15px;
      font-size: 23px;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #b8c0cd;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .input {
      position: relative;
    }

    .icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .7;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 53px;
      padding: 0 45px 0 15px;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      color: white;
      font-size: 13px;
      transition: .3s;
    }

    input:focus {
      border-color: rgba(32,224,112,.55);
      box-shadow: 0 0 0 4px rgba(32,224,112,.07);
    }

    button {
      width: 100%;
      height: 53px;
      border: 0;
      border-radius: 15px;
      margin-top: 8px;
      cursor: pointer;
      background: linear-gradient(135deg,var(--green),#13b95e);
      color: #06100b;
      font-weight: bold;
      font-size: 14px;
      transition: .25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(32,224,112,.20);
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(32,224,112,.7);
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #596475;
      font-size: 10px;
    }

    .toast {
      position: fixed;
      left: 20px;
      bottom: 20px;
      max-width: calc(100% - 40px);
      padding: 14px 17px;
      border-radius: 14px;
      background: rgba(18,25,38,.95);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(100px);
      transition: .4s;
      font-size: 12px;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      border-color: rgba(255,82,104,.35);
      color: #ff8797;
    }

    @media(max-width:500px) {
      .card {
        padding: 27px 21px;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="page">

    <section class="card">

      <div class="logo-area">

        <div class="logo">V2</div>

        <h1>V2GUARD</h1>

        <div class="subtitle">
          ورود به پنل اختصاصی نمایندگان
        </div>

      </div>

      <form id="loginForm">

        <div class="field">

          <label>ایمیل</label>

          <div class="input">

            <span class="icon">📧</span>

            <input
              id="email"
              type="email"
              placeholder="ایمیل خود را وارد کنید"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <div class="field">

          <label>رمز عبور</label>

          <div class="input">

            <span class="icon">🔒</span>

            <input
              id="password"
              type="password"
              placeholder="رمز عبور"
              autocomplete="current-password"
              required
            >

          </div>

        </div>

        <button id="loginButton" type="submit">
          ورود به حساب
        </button>

      </form>

      <div class="status">
        <span class="dot"></span>
        اتصال امن V2GUARD
      </div>

      <div class="footer">
        V2GUARD © 2026
      </div>

    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script>

    const SUPABASE_URL =
      "https://fmrocoflspugyaprvrve.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LW7Kr8R_N9WmHMQkWo8S0A_i02mBfT8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const toast =
      document.getElementById("toast");


    function showToast(message, error = false) {

      toast.textContent = message;

      toast.classList.toggle("error", error);

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }


    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      button.disabled = true;
      button.textContent = "در حال ورود...";


      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


      if (error) {

        console.error(error);

        showToast(
          "ایمیل یا رمز عبور صحیح نیست.",
          true
        );

        button.disabled = false;
        button.textContent = "ورود به حساب";

        return;
      }


      if (!data.user) {

        showToast(
          "ورود انجام نشد.",
          true
        );

        button.disabled = false;
        button.textContent = "ورود به حساب";

        return;
      }


      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("full_name, role, is_active")
        .eq("id", data.user.id)
        .single();


      if (profileError || !profile) {

        await supabaseClient.auth.signOut();

        showToast(
          "پروفایل این حساب پیدا نشد.",
          true
        );

        button.disabled = false;
        button.textContent = "ورود به حساب";

        return;
      }


      if (!profile.is_active) {

        await supabaseClient.auth.signOut();

        showToast(
          "حساب شما غیرفعال است.",
          true
        );

        button.disabled = false;
        button.textContent = "ورود به حساب";

        return;
      }


      showToast(
        "ورود موفق بود. در حال انتقال..."
      );


      setTimeout(() => {

        window.location.href = "index.html";

      }, 700);

    });

  </script>

</body>
</html>
