<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود | V2GUARD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070b12;
      --card: rgba(17, 24, 39, .76);
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8d98a9;
      --green: #20e070;
      --green-dark: #0da653;
      --red: #ff5268;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(32,224,112,.10), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(43,132,255,.09), transparent 30%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .12;
      animation: floating 12s ease-in-out infinite;
    }

    .orb1 {
      background: var(--green);
      top: -150px;
      right: -100px;
    }

    .orb2 {
      background: #2685ff;
      bottom: -150px;
      left: -100px;
      animation-delay: -5s;
    }

    @keyframes floating {
      0%,100% {
        transform: translate(0,0) scale(1);
      }

      50% {
        transform: translate(35px,30px) scale(1.15);
      }
    }

    /* CONTAINER */

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(22,31,48,.86),
          rgba(10,15,25,.80)
        );

      border: 1px solid var(--border);

      backdrop-filter: blur(25px);

      box-shadow:
        0 30px 100px rgba(0,0,0,.45);

      animation: cardIn .8s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* LOGO */

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto;

      display: grid;
      place-items: center;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color: #06100b;

      font-size: 20px;
      font-weight: 900;

      box-shadow:
        0 0 45px rgba(32,224,112,.25);

      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .logo-area h1 {
      margin-top: 15px;
      font-size: 23px;
    }

    .logo-area p {
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    /* INPUT */

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #b8c0cd;
      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .7;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 52px;

      border: 1px solid var(--border);
      outline: none;

      border-radius: 15px;

      background: rgba(255,255,255,.035);

      color: white;

      padding:
        0 45px 0 15px;

      font-size: 13px;

      transition:
        .3s ease;
    }

    input::placeholder {
      color: #657083;
    }

    input:focus {
      border-color: rgba(32,224,112,.55);

      box-shadow:
        0 0 0 4px rgba(32,224,112,.07);

      background:
        rgba(32,224,112,.035);
    }

    /* BUTTON */

    .login-btn {
      width: 100%;
      height: 53px;

      margin-top: 8px;

      border: none;
      border-radius: 15px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--green),
          #13b95e
        );

      color: #06100b;

      font-size: 14px;
      font-weight: bold;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;

      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: "";

      position: absolute;

      width: 80px;
      height: 180px;

      background: rgba(255,255,255,.18);

      transform:
        rotate(25deg)
        translateX(-180px);

      transition:
        transform .6s ease;
    }

    .login-btn:hover::before {
      transform:
        rotate(25deg)
        translateX(450px);
    }

    .login-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 15px 35px rgba(32,224,112,.20);
    }

    .login-btn:active {
      transform: scale(.97);
    }

    /* STATUS */

    .status {
      margin-top: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      color: var(--muted);

      font-size: 11px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px rgba(32,224,112,.7);

      animation:
        pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 0 0 rgba(32,224,112,.6);
      }

      70% {
        box-shadow:
          0 0 0 9px rgba(32,224,112,0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(32,224,112,0);
      }
    }

    /* FOOTER */

    .footer {
      text-align: center;

      margin-top: 23px;

      font-size: 10px;

      color: #596475;
    }

    /* TOAST */

    .toast {
      position: fixed;

      left: 20px;
      bottom: 20px;

      padding:
        13px 17px;

      border-radius: 14px;

      background:
        rgba(18,25,38,.94);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(20px);

      opacity: 0;
      transform:
        translateY(100px);

      transition:
        .4s cubic-bezier(.2,.8,.2,1);

      font-size: 12px;

      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform:
        translateY(0);
    }

    .toast.error {
      border-color:
        rgba(255,82,104,.3);

      color:
        #ff8797;
    }

    /* MOBILE */

    @media(max-width:500px) {

      .page {
        padding: 14px;
      }

      .login-card {
        padding: 27px 21px;
        border-radius: 23px;
      }

      .logo {
        width: 58px;
        height: 58px;
      }

      .logo-area h1 {
        font-size: 21px;
      }

    }

  </style>
</head>

<body>

  <div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <main class="page">

    <section class="login-card">

      <div class="logo-area">

        <div class="logo">
          V2
        </div>

        <h1>
          V2GUARD
        </h1>

        <p>
          ورود به پنل اختصاصی نمایندگان
        </p>

      </div>

      <form id="loginForm">

        <div class="field">

          <label>
            ایمیل یا شماره تلفن
          </label>

          <div class="input-box">

            <span class="input-icon">
              👤
            </span>

            <input
              id="username"
              type="text"
              placeholder="ایمیل یا شماره تلفن خود را وارد کنید"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <div class="field">

          <label>
            رمز عبور
          </label>

          <div class="input-box">

            <span class="input-icon">
              🔒
            </span>

            <input
              id="password"
              type="password"
              placeholder="رمز عبور"
              autocomplete="current-password"
              required
            >

          </div>

        </div>

        <button
          class="login-btn"
          type="submit"
        >
          ورود به حساب
        </button>

      </form>

      <div class="status">

        <span class="status-dot"></span>

        سیستم آنلاین و امن

      </div>

      <div class="footer">
        V2GUARD © 2026
      </div>

    </section>

  </main>

  <div
    class="toast"
    id="toast"
  >
    لطفاً اطلاعات ورود را وارد کنید.
  </div>

  <script>

    const form =
      document.getElementById("loginForm");

    const toast =
      document.getElementById("toast");

    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value.trim();

        if (!username || !password) {

          showToast(
            "لطفاً تمام فیلدها را تکمیل کنید.",
            true
          );

          return;
        }

        showToast(
          "در نسخه بعدی، ورود به حساب واقعی فعال می‌شود."
        );

      }
    );

    function showToast(message, error = false) {

      toast.textContent = message;

      toast.classList.toggle(
        "error",
        error
      );

      toast.classList.add("show");

      setTimeout(
        () => {
          toast.classList.remove("show");
        },
        3000
      );

    }

  </script>

</body>
</html>
