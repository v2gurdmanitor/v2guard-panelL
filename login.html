<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>V2GUARD | ورود نماینده</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b12;
      --card: rgba(16, 23, 37, .82);
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8d98a9;
      --green: #20e070;
      --green-dark: #0da653;
      --red: #ff5268;
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(32,224,112,.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(42,125,255,.10),
          transparent 30%
        ),
        var(--bg);
    }

    /* BACKGROUND */

    .orb {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .13;
      pointer-events: none;
      animation: float 11s ease-in-out infinite;
    }

    .orb1 {
      top: -170px;
      right: -120px;
      background: var(--green);
    }

    .orb2 {
      bottom: -180px;
      left: -120px;
      background: #287fff;
      animation-delay: -5s;
    }

    @keyframes float {

      0%,100% {
        transform: translate(0,0) scale(1);
      }

      50% {
        transform: translate(35px,30px) scale(1.12);
      }

    }

    /* PAGE */

    .page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    /* CARD */

    .card {

      width: 100%;
      max-width: 430px;

      padding: 35px;

      border-radius: 28px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          rgba(23,32,50,.88),
          rgba(8,13,23,.84)
        );

      backdrop-filter: blur(25px);

      box-shadow:
        0 30px 100px rgba(0,0,0,.5);

      animation:
        cardEnter .75s
        cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardEnter {

      from {
        opacity: 0;
        transform:
          translateY(35px)
          scale(.95);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }

    /* LOGO */

    .logoArea {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {

      width: 67px;
      height: 67px;

      margin: auto;

      display: grid;
      place-items: center;

      border-radius: 21px;

      background:
        linear-gradient(
          135deg,
          var(--green),
          var(--green-dark)
        );

      color: #06100b;

      font-size: 21px;
      font-weight: 900;

      box-shadow:
        0 0 45px
        rgba(32,224,112,.25);

      animation:
        logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {

      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }

    }

    .logoArea h1 {

      margin-top: 16px;

      font-size: 24px;
      letter-spacing: .5px;
    }

    .logoArea p {

      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
    }

    /* INPUT */

    .field {
      margin-bottom: 18px;
    }

    .field label {

      display: block;

      margin-bottom: 8px;

      color: #bac2cf;

      font-size: 12px;
    }

    .inputBox {
      position: relative;
    }

    .icon {

      position: absolute;

      right: 15px;
      top: 50%;

      transform:
        translateY(-50%);

      opacity: .7;

      pointer-events: none;
    }

    input {

      width: 100%;
      height: 53px;

      padding:
        0 45px 0 15px;

      border-radius: 15px;

      border:
        1px solid var(--border);

      outline: none;

      background:
        rgba(255,255,255,.035);

      color: white;

      font-size: 13px;

      transition: .3s;
    }

    input::placeholder {
      color: #657083;
    }

    input:focus {

      border-color:
        rgba(32,224,112,.6);

      background:
        rgba(32,224,112,.035);

      box-shadow:
        0 0 0 4px
        rgba(32,224,112,.07);
    }

    /* BUTTON */

    .loginButton {

      width: 100%;
      height: 54px;

      margin-top: 7px;

      border: none;

      border-radius: 15px;

      cursor: pointer;

      color: #06100b;

      font-size: 14px;

      font-weight: bold;

      background:
        linear-gradient(
          135deg,
          var(--green),
          #12b95d
        );

      transition: .25s;

      position: relative;

      overflow: hidden;
    }

    .loginButton:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 15px 35px
        rgba(32,224,112,.22);
    }

    .loginButton:active {

      transform:
        scale(.97);
    }

    .loginButton:disabled {

      opacity: .65;

      cursor: wait;

      transform: none;

      box-shadow: none;
    }

    /* STATUS */

    .status {

      margin-top: 25px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 8px;

      color: var(--muted);

      font-size: 11px;
    }

    .statusDot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background:
        var(--green);

      box-shadow:
        0 0 12px
        rgba(32,224,112,.7);

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0
          rgba(32,224,112,.6);
      }

      70% {
        box-shadow:
          0 0 0 9px
          rgba(32,224,112,0);
      }

      100% {
        box-shadow:
          0 0 0 0
          rgba(32,224,112,0);
      }

    }

    /* FOOTER */

    .footer {

      margin-top: 23px;

      text-align: center;

      color: #596475;

      font-size: 10px;
    }

    /* TOAST */

    .toast {

      position: fixed;

      left: 20px;
      bottom: 20px;

      max-width:
        calc(100% - 40px);

      padding:
        14px 18px;

      border-radius: 14px;

      background:
        rgba(18,25,38,.96);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(20px);

      color: #dce3ed;

      font-size: 12px;

      opacity: 0;

      transform:
        translateY(100px);

      transition:
        .4s
        cubic-bezier(.2,.8,.2,1);

      z-index: 100;
    }

    .toast.show {

      opacity: 1;

      transform:
        translateY(0);
    }

    .toast.error {

      border-color:
        rgba(255,82,104,.35);

      color:
        #ff8797;
    }

    /* MOBILE */

    @media(max-width:500px) {

      .page {
        padding: 14px;
      }

      .card {
        padding: 28px 21px;
        border-radius: 23px;
      }

      .logo {
        width: 59px;
        height: 59px;
      }

      .logoArea h1 {
        font-size: 21px;
      }

    }

  </style>

</head>

<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <main class="page">

    <section class="card">

      <div class="logoArea">

        <div class="logo">
          V2
        </div>

        <h1>
          V2GUARD
        </h1>

        <p>
          ورود به پنل اختصاصی نمایندگان
        </p>

      </div>


      <form id="loginForm">

        <div class="field">

          <label>
            ایمیل
          </label>

          <div class="inputBox">

            <span class="icon">
              📧
            </span>

            <input
              id="email"
              type="email"
              placeholder="ایمیل خود را وارد کنید"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <div class="field">

          <label>
            رمز عبور
          </label>

          <div class="inputBox">

            <span class="icon">
              🔒
            </span>

            <input
              id="password"
              type="password"
              placeholder="رمز عبور"
              autocomplete="current-password"
              required
            >

          </div>

        </div>


        <button
          id="loginButton"
          class="loginButton"
          type="submit"
        >
          ورود به حساب
        </button>

      </form>


      <div class="status">

        <span class="statusDot"></span>

        اتصال امن V2GUARD

      </div>


      <div class="footer">

        V2GUARD © 2026

      </div>

    </section>

  </main>


  <div
    id="toast"
    class="toast"
  ></div>


  <script>

    /* ==========================================
       SUPABASE
    ========================================== */

    const SUPABASE_URL =
      "https://fmrocoflspugyaprvrve.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LW7Kr8R_N9WmHMQkWo8S0A_i02mBfT8";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================
       ELEMENTS
    ========================================== */

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const toast =
      document.getElementById("toast");


    /* ==========================================
       TOAST
    ========================================== */

    function showToast(
      message,
      error = false
    ) {

      toast.textContent =
        message;

      toast.classList.toggle(
        "error",
        error
      );

      toast.classList.add(
        "show"
      );

      setTimeout(
        function() {

          toast.classList.remove(
            "show"
          );

        },
        3500
      );

    }


    /* ==========================================
       LOGIN
    ========================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showToast(
            "ایمیل و رمز عبور را وارد کنید.",
            true
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "در حال ورود...";


        try {

          const result =
            await supabaseClient.auth.signInWithPassword({

              email:
                email,

              password:
                password

            });


          if (result.error) {

            console.error(
              result.error
            );

            showToast(
              "ایمیل یا رمز عبور اشتباه است.",
              true
            );

            button.disabled =
              false;

            button.textContent =
              "ورود به حساب";

            return;
          }


          const user =
            result.data.user;


          if (!user) {

            showToast(
              "کاربر پیدا نشد.",
              true
            );

            button.disabled =
              false;

            button.textContent =
              "ورود به حساب";

            return;
          }


          /* ==================================
             GET PROFILE
          ================================== */

          const profileResult =
            await supabaseClient
              .from("profiles")
              .select(
                "full_name, role, is_active"
              )
              .eq(
                "id",
                user.id
              )
              .maybeSingle();


          if (
            profileResult.error ||
            !profileResult.data
          ) {

            await supabaseClient
              .auth
              .signOut();


            showToast(
              "پروفایل حساب پیدا نشد.",
              true
            );

            button.disabled =
              false;

            button.textContent =
              "ورود به حساب";

            return;
          }


          const profile =
            profileResult.data;


          if (
            profile.is_active !== true
          ) {

            await supabaseClient
              .auth
              .signOut();


            showToast(
              "حساب شما غیرفعال است.",
              true
            );

            button.disabled =
              false;

            button.textContent =
              "ورود به حساب";

            return;
          }


          /* ==================================
             SUCCESS
          ================================== */

          showToast(
            "ورود موفق بود ✓"
          );


          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            900
          );

        }

        catch (error) {

          console.error(
            error
          );

          showToast(
            "خطا در اتصال به سرور.",
            true
          );

          button.disabled =
            false;

          button.textContent =
            "ورود به حساب";

        }

      }
    );

  </script>

</body>

</html>
